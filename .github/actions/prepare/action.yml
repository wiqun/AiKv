name: Prepare workspace
description: >-
  Setup Rust toolchain, rust-cache, protoc, and cargo-nextest.
  Caller MUST `actions/checkout` first.

inputs:
  components:
    description: rustup components (e.g. "clippy, rustfmt")
    required: false
    default: ""
  tools:
    description: prebuilt tools for taiki-e/install-action
    required: false
    default: "protoc, cargo-nextest"
  shared-key:
    description: Swatinem/rust-cache shared key
    required: false
    default: "aikv-ci"

runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: ${{ inputs.components }}
        cache: false

    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.event_name == 'pull_request' }}
        shared-key: ${{ inputs.shared-key }}

    - name: Install tools
      uses: taiki-e/install-action@v2
      with:
        tool: ${{ inputs.tools }}
