name: CI

# 同一分支的新 PR push 会取消尚未完成的旧 run, 避免 CI 积压
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 仅在 PR 合并前触发 (避免合并进 main 后重复跑一次), 并支持手动触发兜底
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fast-gate:
    name: Format, Clippy & Nextest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare workspace (rust + cache + protoc + nextest)
        uses: ./.github/actions/prepare
        with:
          components: clippy, rustfmt
          shared-key: aikv-fast-gate

      - name: Check format
        run: cargo fmt --check

      - name: Clippy (default features: compression + cluster + monitoring)
        run: cargo clippy --all-targets

      - name: Run tests (nextest)
        run: cargo nextest run --profile ci --lib --tests

      - name: Test fallback without compression feature
        run: cargo nextest run --profile ci --no-default-features --lib storage::aidb_options
