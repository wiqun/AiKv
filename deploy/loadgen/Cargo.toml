[package]
name = "loadgen"
version = "0.1.0"
edition = "2021"
publish = false
description = "AiKv 交互式加压工具 (本地/裸机, 单页控制台)"

# 独立 workspace: 防止被 aikv 的 cargo test --workspace / clippy --all-features 连带编译
[workspace]

[dependencies]
anyhow = "1"
arc-swap = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
redis = { version = "1", features = ["tokio-comp", "cluster-async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
