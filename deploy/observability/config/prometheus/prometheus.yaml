global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: node-exporter
    scrape_interval: 15s
    scrape_timeout: 10s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/node.yaml
        refresh_interval: 30s

  - job_name: cadvisor
    scrape_interval: 15s
    scrape_timeout: 10s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/cadvisor.yaml
        refresh_interval: 30s

  - job_name: grafana
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - grafana:3000
