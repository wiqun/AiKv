x-aikv-node: &aikv-node
  image: ${AIKV_IMAGE:-aikv:dev}
  command: ["--config", "/etc/aikv/aikv.toml"]
  restart: unless-stopped
  networks:
    - aikv-net

name: aikv-cluster
services:
  aikv-1:
    <<: *aikv-node
    container_name: aikv-1
    ports:
      - "${AIKV_BIND_IP:-127.0.0.1}:6379:6379"
      - "${AIKV_BIND_IP:-127.0.0.1}:16379:16379"
      - "${AIKV_BIND_IP:-127.0.0.1}:26379:26379"
      - "${AIKV_BIND_IP:-127.0.0.1}:9191:9191"
    volumes:
      - type: bind
        source: ./.runtime/cluster/node1/aikv.toml
        target: /etc/aikv/aikv.toml
        read_only: true
      - aikv1-data:/var/lib/aikv/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9191/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  aikv-2:
    <<: *aikv-node
    container_name: aikv-2
    ports:
      - "${AIKV_BIND_IP:-127.0.0.1}:6380:6380"
      - "${AIKV_BIND_IP:-127.0.0.1}:16380:16380"
      - "${AIKV_BIND_IP:-127.0.0.1}:26380:26380"
      - "${AIKV_BIND_IP:-127.0.0.1}:9192:9192"
    volumes:
      - type: bind
        source: ./.runtime/cluster/node2/aikv.toml
