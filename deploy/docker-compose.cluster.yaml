x-aikv-node: &aikv-node
  image: ${AIKV_IMAGE:-aikv:dev}
  command: ["--config", "/etc/aikv/aikv.toml"]
  restart: unless-stopped
  stop_grace_period: 30s
  environment:
    OTEL_RESOURCE_ATTRIBUTES: "${OTEL_RESOURCE_ATTRIBUTES:-cluster=dev}"
    AIKV_HOST_LABEL: "${AIKV_HOST_LABEL:-localhost}"
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"
  networks:
    - aikv-net

name: aikv-cluster
services:
  aikv-1:
    <<: *aikv-node
    container_name: aikv-1
    ports:
      - "${AIKV_BIND_IP:-127.0.0.1}:6379:6379"
      - "${AIKV_BIND_IP:-127.0.0.1}:16379:16379"
      - "${AIKV_BIND_IP:-127.0.0.1}:26379:26379"
      - "${AIKV_BIND_IP:-127.0.0.1}:9191:9191"
    volumes:
      - type: bind
        source: ./.runtime/cluster/node1/aikv.toml
        target: /etc/aikv/aikv.toml
        read_only: true
      - type: bind
        source: ./.runtime/cluster/node1/data
        target: /var/lib/aikv/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9191/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  aikv-2:
