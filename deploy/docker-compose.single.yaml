name: aikv-single
services:
  aikv-single:
    image: ${AIKV_IMAGE:-aikv:dev}
    command: ["--config", "/etc/aikv/aikv.toml"]
    restart: unless-stopped
    ports:
      - "${AIKV_BIND_IP:-127.0.0.1}:6379:6379"
      - "${AIKV_BIND_IP:-127.0.0.1}:9191:9191"
    volumes:
      - type: bind
        source: ./.runtime/single/aikv.toml
        target: /etc/aikv/aikv.toml
        read_only: true
      - aikv:/var/lib/aikv/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9191/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - aikv-net

volumes:
  aikv:
    name: aikv

networks:
  aikv-net:
    name: aikv-net
