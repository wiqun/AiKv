name: aikv-single
services:
  aikv-single:
    image: ${AIKV_IMAGE:-aikv:dev}
    container_name: aikv-single
    command: ["--config", "/etc/aikv/aikv.toml"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      OTEL_RESOURCE_ATTRIBUTES: "${OTEL_RESOURCE_ATTRIBUTES:-cluster=single}"
      AIKV_HOST_LABEL: "${AIKV_HOST_LABEL:-localhost}"
    ports:
      - "${AIKV_BIND_IP:-127.0.0.1}:6379:6379"
      - "${AIKV_BIND_IP:-127.0.0.1}:9191:9191"
    volumes:
      - type: bind
        source: ./.runtime/single/aikv.toml
        target: /etc/aikv/aikv.toml
        read_only: true
      - type: bind
        source: ./.runtime/single/data
        target: /var/lib/aikv/data
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9191/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - aikv-net

networks:
  aikv-net:
    name: aikv-net
