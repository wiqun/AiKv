[package]
name = "aikv"
version = "1.0.0"
edition = "2021"
description = "Redis RESP2/RESP3 compatible persistent key-value server powered by AiDb"
license = "MIT"
repository = "https://github.com/wiqun/AiKv"
homepage = "https://github.com/wiqun/AiKv"
documentation = "https://docs.rs/aikv"
readme = "README.md"
keywords = ["database", "redis", "key-value", "raft", "resp"]
categories = ["database-implementations", "network-programming", "command-line-utilities"]
exclude = [
  ".cargo/",
  ".github/",
  ".cursor/",
  ".claude/",
  "e2e/",
  "hooks/",
  "install-hooks.sh",
  "clippy.toml",
  "deny.toml",
  "rustfmt.toml",
]

[[bin]]
name = "aikv"
path = "src/main.rs"

[features]
default = ["compression"]
monitoring = ["dep:tracing-opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-proto", "dep:tonic", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:pprof", "aidb/monitoring"]
cluster = ["aidb/cluster", "dep:openraft", "dep:openraft-rt-tokio"]
cluster-test-util = ["cluster", "aidb/cluster-test-util"]
compression = ["aidb/compression"]

[dependencies]
# Async runtime
tokio       = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7", features = ["rt"] }
async-trait = "0.1"

# Core primitives
parking_lot = "0.12"
dashmap = "6"
bytes     = "1"
thiserror = "2"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
postcard  = { version = "1", default-features = false, features = ["alloc"] }
sha1      = "0.10"
itoa = "1"
ryu = "1"
crc32fast = "1"
rand      = "0.8"

# Allocator
mimalloc = "0.1"

# Logging & tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Lua scripting
mlua = { version = "0.10", features = ["lua54", "async", "send", "vendored"] }

# Openraft
openraft = { version = "0.10.0-alpha.33", optional = true }
openraft-rt-tokio = { version = "0.10.0-alpha.33", optional = true }

# AiDb storage engine
aidb = { git = "https://github.com/wiqun/AiDb.git", branch = "main" }

# Monitoring (optional)
# Metrics HTTP server (monitoring feature)
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "metrics"], optional = true }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "testing", "experimental_metrics_custom_reader"], optional = true }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "metrics"], optional = true }
tonic = { version = "0.14", features = ["channel"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }
pprof = { version = "0.14", features = ["prost-codec"], optional = true }

[dev-dependencies]
redis    = { version = "0.24", features = ["tokio-comp"] }
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
proptest = "1"

[profile.release]
lto           = true
codegen-units = 1
debug         = 1   # line tables for eBPF/Pyroscope flame graphs (不 strip)

[lints.clippy]
all = "warn"
