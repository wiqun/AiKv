[advisories]
ignore = [
  # openraft 0.10.0 -> display-more 0.2.6 间接依赖 (chrono-tz / chrono-tz-build 等), 上游暂无安全升级版本
  "RUSTSEC-2026-0543",
  "RUSTSEC-2026-0555",
  "RUSTSEC-2026-0559",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "ISC",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib", # foldhash via tonic-prost-build → prost-build → hashbrown
]

[bans]
multiple-versions = "deny"
skip = [
  # ring v0.17 依赖 getrandom 0.2, 项目已有 getrandom 0.3
  { name = "getrandom" },
  # ring v0.17 依赖 windows-sys 0.52, 项目已有 windows-sys 0.61
  { name = "windows-sys" },
  # wasip2/wasip3 各自锁 wit-bindgen 版本, 经 getrandom→tempfile 传入, 无法合并
  { name = "wit-bindgen" },
  # dashmap 6.x 锁 hashbrown 0.14, indexmap 2.x (经 prost-build) 锁 0.17, 无法合并
  { name = "hashbrown" },
  # sha1 0.10 依赖 cpufeatures 0.2, openraft -> rand 0.10 -> chacha20 依赖 0.3
  { name = "cpufeatures" },
  # prost-build / criterion / opentelemetry 分别依赖不同大版本的 itertools, rand*, syn, r-efi
  { name = "itertools" },
  { name = "r-efi" },
  { name = "rand" },
  { name = "rand_chacha" },
  { name = "rand_core" },
  { name = "syn" },
]

[sources]
unknown-git = "deny"
allow-git = [
  "https://github.com/wiqun/AiDb.git",
]
